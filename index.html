<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kedae Mattowa - Absensi</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Pustaka Library Scanner Barcode / QR Code Gratis -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">

  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

  <!-- Toast Notification -->
  <div id="toast" class="hidden fixed top-5 left-1/2 -translate-x-1/2 bg-indigo-600/90 backdrop-blur-md text-white text-xs px-4 py-2.5 rounded-full shadow-2xl z-50 flex items-center gap-2 border border-indigo-400/30">
    <span id="toast-text">Notifikasi</span>
  </div>

  <!-- Header Realtime -->
  <header class="bg-slate-800/80 backdrop-blur-lg border-b border-slate-700/50 sticky top-0 z-30 px-4 py-3">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-base shadow-lg shadow-indigo-600/30">K</div>
        <div>
          <h1 class="font-bold text-sm text-white">Kedae Mattowa</h1>
          <div class="flex items-center gap-1 text-[10px] text-indigo-400 font-medium">
            <svg class="w-3 h-3 text-rose-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path></svg>
            <span>Mataram, NTB</span>
          </div>
        </div>
      </div>
      <div class="text-right">
        <div id="header-time" class="text-xs font-bold text-emerald-400">00:00:00 WITA</div>
        <div id="header-date" class="text-[10px] text-slate-400">-- --- ----</div>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto w-full p-4 flex-grow space-y-4 mb-20">

    <!-- TAB ABSENSI & SCANNER BARCODE -->
    <section id="tab-absensi" class="space-y-4">
      
      <!-- Card Scanner Barcode Kamera -->
      <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-4 shadow-xl space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300">Scan Barcode / QR ID Card</h2>
          <button onclick="toggleCameraScanner()" id="btn-toggle-cam" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-[10px] px-3 py-1.5 rounded-lg transition shadow">
            Buka Kamera Scan
          </button>
        </div>

        <!-- Area Kamera Kamera Scanner -->
        <div id="scanner-container" class="hidden overflow-hidden rounded-xl border border-indigo-500/50 bg-black/40">
          <div id="reader" class="w-full"></div>
          <p class="text-[10px] text-center text-slate-400 py-2">Arahkan Barcode/QR Code Karyawan ke Kamera</p>
        </div>
      </div>

      <!-- Form Manual / Hasil Scan -->
      <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-4 shadow-xl space-y-3">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300">Konfirmasi / Manual Absen</h2>
        <form id="form-absensi" class="space-y-3">
          <div>
            <label class="block text-[11px] font-medium text-slate-400 mb-1">Karyawan Terpilih</label>
            <select id="absen-karyawan" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition" required>
              <option value="">-- Pilih Manual atau Scan Barcode --</option>
            </select>
          </div>

          <div>
            <label class="block text-[11px] font-medium text-slate-400 mb-1">Status Kehadiran</label>
            <div class="grid grid-cols-4 gap-1.5">
              <label class="cursor-pointer">
                <input type="radio" name="status" value="Hadir" class="peer hidden" checked>
                <div class="py-2 text-center text-[11px] font-semibold rounded-xl border border-slate-700 bg-slate-900/50 text-slate-400 peer-checked:bg-emerald-500/20 peer-checked:text-emerald-400 peer-checked:border-emerald-500/50 transition">Hadir</div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="status" value="Setengah Hari" class="peer hidden">
                <div class="py-2 text-center text-[11px] font-semibold rounded-xl border border-slate-700 bg-slate-900/50 text-slate-400 peer-checked:bg-sky-500/20 peer-checked:text-sky-400 peer-checked:border-sky-500/50 transition">½ Hari</div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="status" value="Izin" class="peer hidden">
                <div class="py-2 text-center text-[11px] font-semibold rounded-xl border border-slate-700 bg-slate-900/50 text-slate-400 peer-checked:bg-amber-500/20 peer-checked:text-amber-400 peer-checked:border-amber-500/50 transition">Izin</div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="status" value="Alpa" class="peer hidden">
                <div class="py-2 text-center text-[11px] font-semibold rounded-xl border border-slate-700 bg-slate-900/50 text-slate-400 peer-checked:bg-rose-500/20 peer-checked:text-rose-400 peer-checked:border-rose-500/50 transition">Alpa</div>
              </label>
            </div>
          </div>

          <div>
            <input type="text" id="absen-catatan" placeholder="Catatan opsional" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
          </div>

          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-xs shadow-lg transition">
            Simpan Absensi
          </button>
        </form>
      </div>

      <!-- Rekap Kehadiran Hari Ini -->
      <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-4 shadow-xl space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300">Absen Hari Ini</h2>
          <span id="total-absen-today" class="text-[10px] font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2.5 py-0.5 rounded-full">0/0</span>
        </div>
        <div id="list-absen-hari-ini" class="space-y-2"></div>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
