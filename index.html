<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi & Gaji Kedae UMKM</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- PWA Manifest & Theme Color -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192x192.png?text=Absensi">

  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

  <!-- Header Top Bar -->
  <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="font-bold text-lg tracking-wide">Kedae Absensi & Gaji</h1>
      <span id="current-date" class="text-xs bg-blue-700 px-2 py-1 rounded"></span>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-md mx-auto w-full p-4 flex-grow mb-16">

    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed top-16 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2 rounded-full shadow-lg z-50"></div>

    <!-- 1. TAB DASHBOARD ABSENSI -->
    <section id="tab-absensi" class="space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
        <h2 class="text-md font-semibold text-slate-700 mb-3">Form Absensi Harian</h2>
        
        <form id="form-absensi" class="space-y-3">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Pilih Karyawan</label>
            <select id="absen-karyawan" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
              <option value="">Memuat data karyawan...</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Status Kehadiran</label>
            <div class="grid grid-cols-3 gap-2">
              <label class="cursor-pointer">
                <input type="radio" name="status" value="Hadir" class="peer hidden" checked>
                <div class="p-2.5 text-center text-xs font-semibold rounded-lg border border-slate-200 bg-slate-50 text-slate-600 peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-600 transition">Hadir</div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="status" value="Izin" class="peer hidden">
                <div class="p-2.5 text-center text-xs font-semibold rounded-lg border border-slate-200 bg-slate-50 text-slate-600 peer-checked:bg-amber-500 peer-checked:text-white peer-checked:border-amber-500 transition">Izin</div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="status" value="Alpa" class="peer hidden">
                <div class="p-2.5 text-center text-xs font-semibold rounded-lg border border-slate-200 bg-slate-50 text-slate-600 peer-checked:bg-rose-600 peer-checked:text-white peer-checked:border-rose-600 transition">Alpa</div>
              </label>
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Catatan / Alasan (Opsional)</label>
            <input type="text" id="absen-catatan" placeholder="Contoh: Sakit flu / Keperluan keluarga" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-medium py-2.5 rounded-lg text-sm shadow transition">
            Simpan Absensi
          </button>
        </form>
      </div>
    </section>

    <!-- 2. TAB KELOLA KARYAWAN -->
    <section id="tab-karyawan" class="hidden space-y-4">
      
      <!-- Form Tambah Karyawan Baru -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
        <h2 class="text-md font-semibold text-slate-700 mb-3">+ Tambah Karyawan Baru</h2>
        <form id="form-tambah-karyawan" class="space-y-3">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Nama Lengkap</label>
            <input type="text" id="add-nama" placeholder="Contoh: Budi Santoso" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm" required>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Jabatan</label>
            <input type="text" id="add-jabatan" placeholder="Contoh: Staf Dapur / Kasir" value="Staf" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm" required>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Tipe Penggajian</label>
              <select id="add-tipe-gaji" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm" required onchange="updateDefaultRate()">
                <option value="Harian">Harian</option>
                <option value="Mingguan">Mingguan</option>
                <option value="Bulanan">Bulanan</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Nominal Gaji (Rp)</label>
              <input type="number" id="add-rate-gaji" placeholder="50000" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm" required>
            </div>
          </div>

          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg text-sm shadow transition">
            Simpan Karyawan Baru
          </button>
        </form>
      </div>

      <!-- List Karyawan -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
        <h2 class="text-md font-semibold text-slate-700 mb-3">Daftar Karyawan Terdaftar</h2>
        <div id="list-karyawan" class="space-y-2"></div>
      </div>

    </section>

    <!-- 3. TAB LAPORAN GAJI & STATUS PEMBAYARAN -->
    <section id="tab-laporan" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
        <h2 class="text-md font-semibold text-slate-700 mb-3">Tracking & Status Gaji</h2>
        
        <div class="space-y-3 mb-4">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Pilih Karyawan</label>
            <select id="laporan-karyawan" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm"></select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Periode Bulan</label>
            <input type="month" id="laporan-bulan" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm">
          </div>
          <button id="btn-hitung-gaji" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm shadow transition">
            Cek & Hitung Gaji
          </button>
        </div>

        <!-- Output Result Gaji & Status Bayar -->
        <div id="hasil-gaji" class="hidden border-t border-slate-100 pt-4 space-y-3 text-xs">
          <div class="flex justify-between items-center">
            <span id="res-nama" class="font-bold text-sm text-slate-800"></span>
            <span id="badge-status" class="px-2.5 py-1 rounded-full font-bold text-[10px]"></span>
          </div>

          <div class="grid grid-cols-3 gap-2 bg-slate-50 p-2.5 rounded-lg text-center">
            <div><span class="block text-slate-400">Hadir</span><b id="res-hadir" class="text-emerald-600 text-sm">0</b></div>
            <div><span class="block text-slate-400">Izin</span><b id="res-izin" class="text-amber-500 text-sm">0</b></div>
            <div><span class="block text-slate-400">Alpa</span><b id="res-alpa" class="text-rose-600 text-sm">0</b></div>
          </div>

          <div class="flex justify-between font-bold text-slate-900 text-sm border-t pt-2">
            <span>Total Gaji Diterima:</span>
            <span id="res-total" class="text-emerald-600">Rp0</span>
          </div>

          <!-- Tombol Aksi Pembayaran -->
          <div id="area-aksi-bayar" class="pt-2">
            <button id="btn-bayar-gaji" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm shadow transition">
              Tandai LUNAS (Proses Bayar)
            </button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 z-50">
    <div class="max-w-md mx-auto grid grid-cols-3 text-center">
      <button onclick="switchTab('absensi')" id="nav-absensi" class="text-blue-600 text-xs font-semibold">Absensi</button>
      <button onclick="switchTab('karyawan')" id="nav-karyawan" class="text-slate-400 text-xs font-semibold">Karyawan</button>
      <button onclick="switchTab('laporan')" id="nav-laporan" class="text-slate-400 text-xs font-semibold">Gaji</button>
    </div>
  </nav>

  <script src="app.js"></script>
</body>
</html>
